# PWA Manager - konfigurasi nginx
#
# Salin ke /etc/nginx/sites-available/pwa-manager lalu:
#   sudo ln -s /etc/nginx/sites-available/pwa-manager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ganti panel.contoh.com dengan domain Anda, dan sesuaikan versi soket PHP-FPM.
#
# PENTING: nginx tidak membaca .htaccess sama sekali. Seluruh aturan yang di
# Apache tersebar di berkas .htaccess sudah dipindahkan ke sini. Menghapus atau
# melewatkan blok "deny" di bawah membuat data/ bisa diunduh siapa saja, dan di
# dalamnya ada hash password admin.

server {
    listen 80;
    listen [::]:80;
    server_name panel.contoh.com;

    # Setelah certbot dijalankan, blok ini otomatis diubah menjadi pengalih
    # ke HTTPS. PWA hanya bisa dipasang lewat HTTPS, jadi sertifikat wajib.
    root /var/www/pwa-manager;
    index index.php;

    charset utf-8;

    # Batas unggah ikon di aplikasi 4 MB; beri ruang untuk overhead multipart
    client_max_body_size 8m;

    access_log /var/log/nginx/pwa-manager.access.log;
    error_log  /var/log/nginx/pwa-manager.error.log;

    # ---------------------------------------------------------------------
    # Folder internal. Padanan "Require all denied" pada .htaccess Apache.
    # data/ memuat hash password admin dan penanda skema; sisanya kode sumber.
    # ---------------------------------------------------------------------
    location ^~ /data/  { return 404; }
    location ^~ /lib/   { return 404; }
    location ^~ /app/   { return 404; }
    location ^~ /views/ { return 404; }
    location ^~ /deploy/ { return 404; }

    # Berkas titik: .git, .env, .skema-v3, .htaccess, dan sejenisnya
    location ~ /\. { return 404; }

    # ---------------------------------------------------------------------
    # Ikon hasil unggah. Hanya gambar yang dilayani; apa pun selain itu ditolak
    # sehingga berkas PHP yang menyusup ke sini tidak akan pernah dieksekusi.
    # ---------------------------------------------------------------------
    location ^~ /uploads/ {
        location ~* ^/uploads/icons/[^/]+\.(png|jpe?g|webp|svg)$ {
            # Landing page di domain lain memakai URL ikon yang penanda
            # versinya bisa beku, jadi revalidasi berkala tetap diperlukan.
            add_header Cache-Control "max-age=600, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        return 404;
    }

    # CSS dan JS panel; namanya sudah ber-versi lewat ?v=
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Router. Berkas nyata dilayani langsung, sisanya ke index.php.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri /index.php?$query_string;
    }

    # ---------------------------------------------------------------------
    # PHP. Aplikasi ini hanya punya satu pintu masuk, jadi hanya index.php
    # yang boleh dieksekusi. Berkas .php lain mana pun ditolak.
    # ---------------------------------------------------------------------
    location = /index.php {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # Dipatok agar base_path() menghasilkan string kosong. Bila panel
        # dipasang di subfolder, ubah menjadi /subfolder/index.php.
        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        # Ekspor CSV dan penghapusan log per bulan bisa berjalan lama
        fastcgi_read_timeout 300s;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ \.php$ { return 404; }

    # ---------------------------------------------------------------------
    # Kompresi. Manifest dan JSON ikut dimampatkan; gambar tidak ada gunanya.
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # Header keamanan. X-Frame-Options dan X-Content-Type-Options juga dikirim
    # aplikasi; di sini sebagai jaring pengaman bila PHP gagal berjalan.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
